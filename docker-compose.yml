services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: hozourban
      POSTGRES_USER: hozourban
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - "5432:5432"
    volumes:
      - hozourban_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hozourban -d hozourban"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  hozourban_db:
